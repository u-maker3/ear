<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>うめこ専用 耳つぼ全座標マップ</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#fff4f1;color:#392e2d;text-align:center}
.wrap{max-width:540px;margin:auto;padding:16px 14px 42px} h1{font-size:24px;margin:4px 0} .small{font-size:12px;color:#766}
.status{display:flex;gap:8px;margin:12px 0} .status div{flex:1;background:white;padding:10px 4px;border-radius:14px;font-weight:800}
.panel{background:#fff;border-radius:20px;padding:13px;box-shadow:0 5px 20px #0001} .name{font-size:30px;font-weight:900;margin:3px}
.badge{font-size:13px;font-weight:800;color:#8b5b53} .ear{position:relative;width:min(88vw,400px);margin:auto;touch-action:manipulation}
.ear img{display:block;width:100%;height:auto;border-radius:14px} .dot{position:absolute;width:22px;height:22px;border-radius:50%;background:#e83f4d;border:4px solid white;box-shadow:0 1px 7px #0007;transform:translate(-50%,-50%);pointer-events:none}
.result{font-size:17px;font-weight:850;min-height:48px;margin:8px 0}
button,select{border:0;border-radius:13px;padding:12px 13px;margin:4px;font-size:15px;font-weight:800} button{background:#80536f;color:#fff} button.alt{background:#eadde5;color:#563b4f}
select{width:96%;background:#f6edf2;color:#3d3038} .nav{display:flex;justify-content:center;flex-wrap:wrap}
.list{text-align:left;background:white;border-radius:18px;margin-top:14px;padding:12px;line-height:1.7;font-size:13px;white-space:pre-wrap}
.done{color:#18855d;font-weight:800} .todo{color:#999}
</style></head><body><div class="wrap">
<h1>👂 うめこ専用 耳つぼ全座標マップ</h1>
<div class="small">全ポイントをここ1本で登録・修正</div>
<div class="status"><div>全体<br><span id="total"></span></div><div>登録済<br><span id="done"></span></div><div>未登録<br><span id="remain"></span></div></div>
<div class="panel">
<select id="picker"></select>
<div class="badge" id="badge"></div><div class="name" id="name"></div>
<div class="small">協会テキストを見て、正しい位置をタップ 👆</div>
<div class="ear" id="ear"><img src="ear_base.PNG" alt="耳"><span id="dot"></span></div>
<div class="result" id="result"></div>
<div class="nav"><button class="alt" id="prev">← 前へ</button><button class="alt" id="clear">取り直す</button><button id="next">次へ →</button></div>
<button id="nextTodo">未登録へジャンプ 📍</button>
</div>
<div class="list" id="list"></div>
</div><script>
const P=["神門", "角窩中", "内生殖器", "交感", "坐骨神経", "股関節", "膝", "踝", "風渓", "腰仙椎", "胸椎", "頸椎", "腕", "肘", "肩", "鎖骨", "後頭", "側頭", "前頭", "大脳皮質下", "顎", "歯", "内耳", "目", "扁桃体", "内分泌", "三焦", "肺", "心", "気管", "副腎", "飢点", "内鼻", "咽頭", "口", "食道", "噴門", "胃", "小腸", "大腸", "腎", "膀胱", "艇角", "肝", "脾", "耳中", "肛門", "耳先", "耳輪", "耳迷根"];
let S={"肩": {"x": "84.0", "y": "46.8"}, "膝": {"x": "64.3", "y": "14.6"}, "胃": {"x": "55.1", "y": "48.3"}, "肺": {"x": "51.9", "y": "53.5"}, "目": {"x": "36.9", "y": "82.6"}, "腎": {"x": "45.0", "y": "35.9"}};
let i=0;
const picker=document.getElementById("picker"),ear=document.getElementById("ear"),dot=document.getElementById("dot");
function persist(){localStorage.setItem("umekoEarCoords",JSON.stringify(S));}
try{const old=JSON.parse(localStorage.getItem("umekoEarCoords")||"null");if(old)S={...S,...old}}catch(e){}
function draw(){
 picker.innerHTML=P.map((p,k)=>`<option value="${k}">${S[p]?"✓ ":"○ "}${p}</option>`).join(""); picker.value=i;
 const p=P[i],v=S[p]; name.textContent=p; badge.textContent=`${i+1} / ${P.length}　${v?"登録済み":"未登録"}`;
 if(v){dot.className="dot";dot.style.left=v.x+"%";dot.style.top=v.y+"%";result.textContent=`📍 ${p}：X ${v.x} / Y ${v.y}`;}
 else{dot.className="";result.textContent="まだ未登録";}
 const d=P.filter(x=>S[x]).length; total.textContent=P.length; done.textContent=d; remain.textContent=P.length-d;
 list.innerHTML="【登録状況】\n"+P.map(x=>S[x]?`✓ ${x}　X ${S[x].x} / Y ${S[x].y}`:`○ ${x}`).join("\n");
}
ear.addEventListener("pointerup",e=>{const r=ear.getBoundingClientRect();const x=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)).toFixed(1),y=Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100)).toFixed(1);S[P[i]]={x,y};persist();draw();});
picker.onchange=e=>{i=+e.target.value;draw()}; prev.onclick=()=>{i=(i-1+P.length)%P.length;draw()}; next.onclick=()=>{i=(i+1)%P.length;draw()};
clear.onclick=()=>{delete S[P[i]];persist();draw()};
nextTodo.onclick=()=>{for(let n=1;n<=P.length;n++){let k=(i+n)%P.length;if(!S[P[k]]){i=k;draw();return}} alert("全部登録済みやで🤣");};
draw();
</script></body></html>
