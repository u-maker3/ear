<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>うめこの耳つぼカルタ道場</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(#fff8f1,#ffe9e8);color:#3d302b;min-height:100vh}.app{max-width:560px;margin:auto;padding:12px 14px 32px}h1{text-align:center;font-size:23px;margin:5px 0 1px}.sub{text-align:center;font-size:13px;opacity:.65;margin:0 0 9px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#fff;border-radius:15px;padding:7px;text-align:center;box-shadow:0 4px 15px #6b403012;font-size:12px}.stat b{display:block;font-size:20px}.question{background:#fff;border-radius:18px;padding:11px;margin:9px 0;text-align:center;box-shadow:0 5px 18px #6b403014}.question small{display:block;opacity:.55}.question strong{display:block;font-size:28px}.earbox{position:relative;background:#fff;border-radius:24px;padding:8px;box-shadow:0 7px 24px #6b403018;overflow:hidden;touch-action:manipulation;cursor:pointer}.earbox img{display:block;width:100%;height:auto;pointer-events:none;user-select:none;-webkit-user-drag:none}.taplayer{position:absolute;inset:8px;z-index:10;touch-action:manipulation}.marker{position:absolute;width:26px;height:26px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:20;animation:pop .18s ease-out}.marker.ok{background:#23a475aa;border:4px solid #15835d}.marker.ng{background:#e44848aa;border:4px solid #c92e2e}@keyframes pop{from{transform:translate(-50%,-50%) scale(.35)}to{transform:translate(-50%,-50%) scale(1)}}.msg{text-align:center;min-height:36px;font-weight:900;font-size:19px;padding:8px}.hint{text-align:center;font-size:12px;opacity:.62;margin:-3px 0 8px}.controls button{width:100%;border:0;border-radius:15px;padding:12px;background:#fff;font-weight:800;color:#3d302b;box-shadow:0 4px 14px #50382c16}.note{font-size:11px;line-height:1.5;opacity:.6;margin:9px 3px 0}dialog{border:0;border-radius:22px;padding:22px;width:min(88vw,420px);text-align:center;box-shadow:0 15px 60px #0004}dialog::backdrop{background:#0006}dialog button{border:0;border-radius:14px;padding:12px 22px;background:#e85d75;color:#fff;font-weight:800}
</style></head><body><main class="app"><h1>👂 うめこの耳つぼカルタ道場</h1><p class="sub">試作弐号機｜耳そのものをタップ！</p><section class="stats"><div class="stat">TIME<b id="time">00:00</b></div><div class="stat">GET<b id="score">0/6</b></div><div class="stat">ミス<b id="miss">0</b></div></section><section class="question"><small>読み札</small><strong id="question">スタート！</strong></section><section class="earbox" id="earbox"><img src="ear_base.PNG" alt="耳"><div class="taplayer" id="taplayer" role="button" aria-label="耳をタップ"></div></section><div class="msg" id="msg">耳を直接タップしてな👆</div><div class="hint">タップした場所に●が出たら反応成功👌</div><div class="controls"><button id="restart">🔀 最初から</button></div><p class="note">※ポイント座標は動作確認用の仮配置。協会テキストの正解位置として確定していません。今回はiPhoneで確実に反応するよう、耳画像全体を1枚のタップ面にしています。</p></main><dialog id="clear"><h2>🎊 6枚GET！</h2><p id="result"></p><p id="rank"></p><button id="again">もう一戦🤣</button></dialog>
<script>
const points=[{id:'kata',name:'肩'},{id:'hiza',name:'膝'},{id:'i',name:'胃'},{id:'hai',name:'肺'},{id:'me',name:'目'},{id:'jin',name:'腎'}];
let current=0;
const $=s=>document.querySelector(s), q=$('#question'),msg=$('#msg'),layer=$('#taplayer');
function mark(x,y){layer.querySelectorAll('.marker').forEach(m=>m.remove());let m=document.createElement('i');m.className='marker ok';m.style.left=x+'%';m.style.top=y+'%';layer.appendChild(m)}
function show(){q.textContent=points[current].name+' の正解位置を登録';document.querySelector('#score').textContent=(current+1)+'/6';document.querySelector('#miss').textContent='—';document.querySelector('#time').textContent='調整';msg.textContent='テキストを見て「'+points[current].name+'」の位置を1回タップ👆';}
function handle(clientX,clientY){let r=layer.getBoundingClientRect();let x=(clientX-r.left)/r.width*100,y=(clientY-r.top)/r.height*100;if(x<0||x>100||y<0||y>100)return;mark(x,y);let xs=x.toFixed(1),ys=y.toFixed(1);msg.innerHTML='📍 <b>'+points[current].name+'</b>：X <b>'+xs+'</b> ／ Y <b>'+ys+'</b><br><span style="font-size:13px">この数字をスクショかメモしてな👌</span>';}
layer.addEventListener('pointerdown',e=>{e.preventDefault();handle(e.clientX,e.clientY)},{passive:false});
$('#restart').textContent='➡️ 次のポイント';
$('#restart').addEventListener('click',()=>{current=(current+1)%points.length;layer.querySelectorAll('.marker').forEach(m=>m.remove());show()});
document.querySelector('.sub').textContent='座標調整モード｜正解位置をうめこが登録';
document.querySelector('.hint').textContent='●の位置と X・Y の数字が出れば成功👌';
document.querySelector('.note').textContent='※これはゲーム本番ではなく位置合わせ専用。協会テキストを見ながら、各ポイントの正解位置をタップして座標を取得します。';
const d=$('#clear'); if(d)d.remove();
show();
</script></body></html>
