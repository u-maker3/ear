<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>耳迷根 座標登録</title><style>*{box-sizing:border-box}body{margin:0;background:#fff4f1;color:#382d2c;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;text-align:center}.wrap{max-width:520px;margin:auto;padding:18px 14px 36px}.card{background:#fff;border-radius:22px;padding:14px}h1{font-size:25px}.name{font-size:31px;font-weight:900}.ear{position:relative;width:min(90vw,410px);margin:12px auto;touch-action:manipulation}.ear img{display:block;width:100%;border-radius:16px}.dot{position:absolute;width:24px;height:24px;border-radius:50%;background:#15966f;border:4px solid white;transform:translate(-50%,-50%);pointer-events:none}#result{font-size:20px;font-weight:900;min-height:55px}button{border:0;border-radius:14px;padding:13px 18px;font-size:16px;font-weight:800;background:#80536f;color:#fff}.note{font-size:12px;color:#766;margin-top:12px}</style></head><body><div class="wrap"><h1>👂🔄 耳裏 座標登録</h1><div class="card"><div>登録するポイント</div><div class="name">耳迷根</div><div>協会テキストを見て正しい位置をタップ 👆</div><div class="ear" id="ear"><img src="ear_back.PNG" alt="耳裏"><span id="dot"></span></div><div id="result">まだ未登録</div><button id="clear">↩︎ 取り直す</button></div><div class="note">表示された X / Y をスクショしてチャピコへ送ってな👌</div></div><script>const ear=document.getElementById("ear"),dot=document.getElementById("dot"),result=document.getElementById("result");ear.addEventListener("pointerup",e=>{const r=ear.getBoundingClientRect();const x=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)).toFixed(1),y=Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100)).toFixed(1);dot.className="dot";dot.style.left=x+"%";dot.style.top=y+"%";result.textContent=`📍 耳迷根：X ${x} / Y ${y}`});document.getElementById("clear").onclick=()=>{dot.className="";result.textContent="まだ未登録"};</script></body></html>
