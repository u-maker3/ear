<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>耳つぼ どこやねん！</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fff3ef;color:#382d2b;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;text-align:center}.w{max-width:520px;margin:auto;padding:14px}.stats{display:flex;gap:7px;margin-bottom:9px}.stats div,.c{background:#fff;border-radius:18px;padding:10px;flex:1}#q{font-size:30px;font-weight:900;margin:3px}.ear{position:relative;width:min(90vw,410px);margin:8px auto;touch-action:manipulation}img{width:100%;display:block;border-radius:14px}.mark,.answer{position:absolute;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}.mark{width:26px;height:26px;border:4px solid #fff;box-shadow:0 1px 7px #0007}.answer{width:52px;height:52px;border:5px solid #15966f;background:#15966f55;animation:pulse .55s ease 2}@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.45)}}#pop{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) scale(.7);opacity:0;pointer-events:none;background:#fffdf8eF;border-radius:22px;padding:10px 16px;font-size:25px;font-weight:900;white-space:nowrap;box-shadow:0 5px 18px #0002;z-index:5}#pop.show{animation:popin .7s ease forwards}@keyframes popin{0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}45%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}#msg{min-height:48px;font-size:18px;font-weight:900}button{border:0;border-radius:14px;padding:13px 17px;margin:5px;font-weight:900;font-size:16px;background:#87566f;color:#fff}.choice button{min-width:110px}.nearBtns{margin-top:2px}.skipBtn{background:#d9c8d1;color:#513d48}.hide{display:none}.sub{font-size:13px;color:#826f69}</style></head><body><div class=w><h2>👂 耳つぼ どこやねん！</h2><div class=sub>耳の地図を遊んで覚えるゲーム</div>
<div id=menu class=c><b>何問いく？🤣</b><div class=choice><button data-n=10>サクッと<br>10問</button><button data-n=20>しっかり<br>20問</button><button data-n=50>地獄の<br>全50問</button></div><div class=sub>毎回ランダム出題やで👌</div><div class=sub style="margin-top:10px">※耳の形や位置には個人差があります。このゲームは位置関係をざっくり楽しく覚えるための学習用です。細かい位置・判断が難しい場所は、必ず協会テキストで確認してください。</div></div>
<div id=game class=hide><div class=stats><div>TIME<br><b id=time>00:00</b></div><div>正解<br><b id=ok>0</b></div><div>ミス<br><b id=miss>0</b></div><div>スルー<br><b id=skips>0</b></div></div><div class=c><small id=side></small><div id=q></div><div class=ear id=ear><img id=img src=ear_base.PNG><span id=mark></span><div id=pop></div></div><div id=msg></div><div class="nearBtns"><button id=next class=hide>➡️ 次の札</button><button id=skip class="skipBtn">🙈 わからん！スルー</button></div></div></div></div>
<script>
const F={"神門": [48.5, 28.6], "角窩中": [41.8, 27.5], "内生殖器": [33.9, 24.6], "交感": [33.5, 30.1], "坐骨神経": [39.6, 31.4], "股関節": [54.9, 28.5], "膝": [51.4, 21.1], "踝": [63.3, 16.1], "風渓": [70.7, 18.8], "腰仙椎": [64.1, 25.3], "胸椎": [73.7, 37.4], "頸椎": [73.8, 54.0], "腕": [76, 22.8], "肘": [78.3, 27.1], "肩": [84, 46.8], "鎖骨": [74.8, 61], "後頭": [58.2, 67.1], "側頭": [62.2, 65.1], "前頭": [44.4, 67.9], "大脳皮質下": [46.2, 60.9], "顎": [61, 72.8], "歯": [26.3, 76.7], "内耳": [56.1, 83.9], "目": [36.9, 82.6], "扁桃体": [35.9, 91.2], "内分泌": [28, 67.4], "三焦": [28.6, 65.9], "肺": [52.1, 56.5], "心": [41.9, 59.2], "気管": [36.1, 59.6], "副腎": [23.3, 55.6], "飢点": [16.3, 54.7], "内鼻": [24.8, 56.2], "咽頭": [20, 50.2], "口": [36, 50.5], "食道": [40.4, 50.1], "噴門": [43.1, 50.4], "胃": [55.1, 48.3], "小腸": [47.7, 42.7], "大腸": [39.9, 39.5], "腎": [45, 35.9], "膀胱": [36.4, 34.8], "艇角": [32.6, 34.5], "肝": [60.3, 41.7], "脾": [67.1, 48.1], "耳中": [48.6, 47.3], "肛門": [36.2, 11.1], "耳先": [57.4, 4.3]},B={"耳迷根":[84.2,47.7]},ALL=[...Object.keys(F),"耳輪","耳迷根"];let D=[],i=0,o=0,m=0,s=0,lock=false,t0=0,T;
function sh(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function tick(){let s=Math.floor((Date.now()-t0)/1000);time.textContent=String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function show(){lock=false;mark.className="";pop.className="";pop.innerHTML="";let n=D[i];q.textContent=n;side.textContent=`読み札 ${i+1} / ${D.length}`;img.src=n==="耳迷根"?"ear_back.PNG":"ear_base.PNG";msg.textContent="どこや！と思う辺りをポチッ👆";next.className="hide"}
function good(n,x,y){if(n==="耳輪")return (x>78&&y>10&&y<80)||(y<15&&x>34&&x<82);let p=n==="耳迷根"?B[n]:F[n];return Math.hypot(x-p[0],y-p[1])<=9}
ear.onpointerup=e=>{if(lock)return;let r=ear.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100,n=D[i];mark.className="mark";mark.style.left=x+"%";mark.style.top=y+"%";if(good(n,x,y)){mark.style.background="#15966f";ok.textContent=++o;lock=true;pop.innerHTML="💮 せいかーい！<br><span style=\"font-size:14px\">その辺、その辺🤣</span>";pop.className="show";msg.textContent="";next.className=""}else{mark.style.background="#e64b52";miss.textContent=++m;pop.innerHTML="そこちゃう🤣";pop.className="show";setTimeout(()=>{pop.className="";},650);msg.textContent="もう一回👆"}};
function advance(){if(++i>=D.length){clearInterval(T);tick();q.textContent="本日の耳探検、終了💮";msg.textContent=`正解 ${o}問 ／ ミス ${m}回 ／ スルー ${s}問 ／ TIME ${time.textContent}`;next.className="hide";skip.className="hide";setTimeout(()=>{menu.className="c";game.className="hide";skip.className="skipBtn"},2200)}else show()}
document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{let n=+b.dataset.n;D=sh([...ALL]).slice(0,n);i=o=m=s=0;ok.textContent=miss.textContent=skips.textContent=0;menu.className="hide";game.className="";t0=Date.now();clearInterval(T);T=setInterval(tick,500);show()});
next.onclick=advance;skip.onclick=()=>{if(lock)return;s++;skips.textContent=s;pop.innerHTML="🙈 スルー！<br><span style=\"font-size:14px\">テキスト見よ🤣</span>";pop.className="show";lock=true;setTimeout(advance,650)};
</script></body></html>
