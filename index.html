<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>マスター7 座標登録機</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#fff7fb;color:#352c36;text-align:center}.wrap{max-width:520px;margin:auto;padding:18px 14px 36px}.panel,.all{background:#fff;border-radius:18px;padding:13px;box-shadow:0 5px 20px #0001}.name{font-size:30px;font-weight:900}.step{font-weight:800;color:#8d6280}.ear{position:relative;width:min(88vw,390px);margin:auto;touch-action:manipulation}.ear img{display:block;width:100%;border-radius:14px}.dot{position:absolute;width:22px;height:22px;border-radius:50%;background:#e8324a;border:4px solid #fff;transform:translate(-50%,-50%);pointer-events:none}.result{min-height:48px;margin:10px;font-weight:800}button{border:0;border-radius:14px;padding:13px 17px;margin:5px;font-size:16px;font-weight:800;background:#7b4d72;color:#fff}button.alt{background:#eadde7;color:#5a3d55}button:disabled{opacity:.4}.all{text-align:left;margin-top:14px;white-space:pre-wrap;font-size:13px;line-height:1.7}</style></head><body><div class="wrap"><h2>👂 マスター7 座標登録機</h2><p>協会テキストを見ながら正解位置をタップ</p><div class="panel"><div class="step" id="step"></div><div class="name" id="name"></div><p>正しい位置を1回タップ 👆</p><div class="ear" id="ear"><img src="master7_ear_base.PNG"><span id="dot"></span></div><div class="result" id="result">まだ未登録</div><button class="alt" id="retry">取り直す</button><button id="next" disabled>次へ ➡️</button></div><div class="all" id="all">📍 登録結果
</div></div><script>
const P=["耳中","大脳皮質下","神門","交感","副腎","内分泌","耳先"];let n=0,S={};const ear=document.getElementById("ear"),dot=document.getElementById("dot"),next=document.getElementById("next");
function show(){step.textContent=(n+1)+" / "+P.length;name.textContent=P[n];let p=S[P[n]];result.textContent=p?"📍 "+P[n]+"：X "+p.x+" / Y "+p.y:"まだ未登録";next.disabled=!p;next.textContent=n===P.length-1?"登録完了 🎉":"次へ ➡️";if(p){dot.className="dot";dot.style.left=p.x+"%";dot.style.top=p.y+"%"}else dot.className="";let t="📍 登録結果\n";P.forEach(k=>{if(S[k])t+=k+"：X "+S[k].x+" / Y "+S[k].y+"\n"});all.textContent=t}
ear.addEventListener("pointerup",e=>{let r=ear.getBoundingClientRect(),x=((e.clientX-r.left)/r.width*100).toFixed(1),y=((e.clientY-r.top)/r.height*100).toFixed(1);S[P[n]]={x:x,y:y};show()});
retry.onclick=()=>{delete S[P[n]];show()};next.onclick=()=>{if(!S[P[n]])return;if(n<P.length-1){n++;show()}else{result.innerHTML="🎉 7ポイント登録完了！<br>登録結果をスクショして送ってな🤣";next.disabled=true}};show();
</script></body></html>
