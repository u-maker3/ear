<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>うめこの耳つぼカルタ道場</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(#fff8f1,#ffe9e8);color:#3d302b;min-height:100vh}.app{max-width:560px;margin:auto;padding:12px 14px 32px}h1{text-align:center;font-size:23px;margin:5px 0 1px}.sub{text-align:center;font-size:13px;opacity:.65;margin:0 0 9px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#fff;border-radius:15px;padding:7px;text-align:center;box-shadow:0 4px 15px #6b403012;font-size:12px}.stat b{display:block;font-size:20px}.question{background:#fff;border-radius:18px;padding:11px;margin:9px 0;text-align:center;box-shadow:0 5px 18px #6b403014}.question small{display:block;opacity:.55}.question strong{display:block;font-size:30px}.earbox{position:relative;background:#fff;border-radius:24px;padding:8px;box-shadow:0 7px 24px #6b403018;overflow:hidden;touch-action:manipulation}.earbox img{display:block;width:100%;height:auto;pointer-events:none;user-select:none;-webkit-user-drag:none}.taplayer{position:absolute;inset:8px;z-index:10;touch-action:manipulation}.marker{position:absolute;width:28px;height:28px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:20;animation:pop .18s ease-out}.marker.ok{background:#23a475aa;border:4px solid #15835d}.marker.ng{background:#e44848aa;border:4px solid #c92e2e}@keyframes pop{from{transform:translate(-50%,-50%) scale(.35)}to{transform:translate(-50%,-50%) scale(1)}}.msg{text-align:center;min-height:44px;font-weight:900;font-size:19px;padding:9px}.hint{text-align:center;font-size:12px;opacity:.62;margin:-3px 0 8px}.controls button{width:100%;border:0;border-radius:15px;padding:12px;background:#fff;font-weight:800;color:#3d302b;box-shadow:0 4px 14px #50382c16}.note{font-size:11px;line-height:1.5;opacity:.6;margin:9px 3px 0}dialog{border:0;border-radius:22px;padding:22px;width:min(88vw,420px);text-align:center;box-shadow:0 15px 60px #0004}dialog::backdrop{background:#0006}dialog button{border:0;border-radius:14px;padding:12px 22px;background:#e85d75;color:#fff;font-weight:800}
</style></head><body><main class="app"><h1>👂 うめこの耳つぼカルタ道場</h1><p class="sub">本番試作｜6ポイント編</p><section class="stats"><div class="stat">TIME<b id="time">00:00</b></div><div class="stat">GET<b id="score">0/6</b></div><div class="stat">ミス<b id="miss">0</b></div></section><section class="question"><small>読み札</small><strong id="question">準備中…</strong></section><section class="earbox"><img src="ear_base.PNG" alt="耳"><div class="taplayer" id="taplayer" role="button" aria-label="耳をタップ"></div></section><div class="msg" id="msg">読み札の場所をタップ👆</div><div class="hint">正解は緑●／ミスは赤●</div><div class="controls"><button id="restart">🔀 もう一回</button></div><p class="note">※うめこが登録した6ポイントの座標を使用した個人学習用試作版です。</p></main><dialog id="clear"><h2>🎊 全部取ったで！</h2><p id="result"></p><p id="rank"></p><button id="again">もう一戦🤣</button></dialog><script>
const BASE=[
 {name:'肩',x:84.0,y:46.8},{name:'膝',x:64.3,y:14.6},{name:'胃',x:55.1,y:48.3},
 {name:'肺',x:51.9,y:53.5},{name:'目',x:36.9,y:82.6},{name:'腎',x:45.0,y:35.9}
];
const RADIUS=8.5; let deck=[],idx=0,miss=0,start=0,timer=null,locked=false;
const $=s=>document.querySelector(s), layer=$('#taplayer'),q=$('#question'),msg=$('#msg');
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function fmt(sec){return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function tick(){if(start)$('#time').textContent=fmt(Math.floor((Date.now()-start)/1000))}
function marker(x,y,ok){layer.querySelectorAll('.marker').forEach(m=>m.remove());const m=document.createElement('i');m.className='marker '+(ok?'ok':'ng');m.style.left=x+'%';m.style.top=y+'%';layer.appendChild(m)}
function show(){q.textContent=deck[idx].name;$('#score').textContent=idx+'/6';msg.textContent='「'+deck[idx].name+'」はどこ？👆';locked=false}
function begin(){clearInterval(timer);deck=shuffle(BASE);idx=0;miss=0;start=Date.now();$('#miss').textContent=0;$('#time').textContent='00:00';layer.innerHTML='';timer=setInterval(tick,250);show()}
function tap(cx,cy){if(locked||idx>=deck.length)return;const r=layer.getBoundingClientRect(),x=(cx-r.left)/r.width*100,y=(cy-r.top)/r.height*100;if(x<0||x>100||y<0||y>100)return;const p=deck[idx],dx=x-p.x,dy=y-p.y,dist=Math.hypot(dx,dy);if(dist<=RADIUS){locked=true;marker(p.x,p.y,true);msg.textContent='それやーー！👏 '+p.name;idx++;$('#score').textContent=idx+'/6';setTimeout(()=>{layer.innerHTML='';if(idx===deck.length)finish();else show()},650)}else{miss++;$('#miss').textContent=miss;marker(x,y,false);msg.textContent='そこちゃう🤣 もう一回！'}}
function finish(){clearInterval(timer);tick();const sec=Math.floor((Date.now()-start)/1000);q.textContent='全6枚GET！';msg.textContent='耳、覚えてきたやん🤣';$('#result').innerHTML='TIME <b>'+fmt(sec)+'</b><br>ミス <b>'+miss+'</b>回';let rank=miss===0?'👑 称号：耳の住人':miss<=3?'✨ 称号：だいぶ耳わかってきた':'👂 称号：耳さわり見習い';$('#rank').textContent=rank;$('#clear').showModal()}
layer.addEventListener('pointerdown',e=>{e.preventDefault();tap(e.clientX,e.clientY)},{passive:false});$('#restart').onclick=begin;$('#again').onclick=()=>{$('#clear').close();begin()};begin();
</script></body></html>
