<!doctype html><html lang=ja><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>耳つぼカルタ</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff3ef;color:#382d2b;font-family:-apple-system,sans-serif;text-align:center}.w{max-width:520px;margin:auto;padding:14px}.stats{display:flex;gap:7px}.stats div,.c{background:white;border-radius:18px;padding:10px;flex:1}#q{font-size:30px;font-weight:900}.ear{position:relative;width:min(90vw,410px);margin:auto;touch-action:manipulation}img{width:100%;display:block;border-radius:14px}.m{position:absolute;width:25px;height:25px;border-radius:50%;border:4px solid white;transform:translate(-50%,-50%);pointer-events:none}#msg{min-height:45px;font-size:19px;font-weight:900}button{border:0;border-radius:14px;padding:13px 18px;margin:5px;font-weight:900;font-size:16px;background:#87566f;color:white}.hide{display:none}</style></head><body><div class=w><h2>👂 うめこ式 耳つぼカルタ</h2><div class=stats><div>TIME<br><b id=time>00:00</b></div><div>正解<br><b id=ok>0</b></div><div>ミス<br><b id=miss>0</b></div></div><div class=c><small id=side>読み札</small><div id=q>開門待ち</div><div class=ear id=ear><img id=img src=ear_base.PNG><span id=mark></span></div><div id=msg>「開門」でスタート🤣</div><button id=start>🔥 開門</button><button id=next class=hide>➡️ 次の札</button></div></div><script>
const F={"神門": [48.5, 28.6], "角窩中": [41.8, 27.5], "内生殖器": [33.9, 24.6], "交感": [33.5, 30.1], "坐骨神経": [39.6, 31.4], "股関節": [54.9, 28.5], "膝": [51.4, 21.1], "踝": [63.3, 16.1], "風渓": [70.7, 18.8], "腰仙椎": [64.1, 25.3], "胸椎": [73.7, 37.4], "頸椎": [73.8, 54.0], "腕": [76, 22.8], "肘": [78.3, 27.1], "肩": [84, 46.8], "鎖骨": [74.8, 61], "後頭": [58.2, 67.1], "側頭": [62.2, 65.1], "前頭": [44.4, 67.9], "大脳皮質下": [46.2, 60.9], "顎": [61, 72.8], "歯": [26.3, 76.7], "内耳": [56.1, 83.9], "目": [36.9, 82.6], "扁桃体": [35.9, 91.2], "内分泌": [28, 67.4], "三焦": [28.6, 65.9], "肺": [52.1, 56.5], "心": [41.9, 59.2], "気管": [36.1, 59.6], "副腎": [23.3, 55.6], "飢点": [16.3, 54.7], "内鼻": [24.8, 56.2], "咽頭": [20, 50.2], "口": [36, 50.5], "食道": [40.4, 50.1], "噴門": [43.1, 50.4], "胃": [55.1, 48.3], "小腸": [47.7, 42.7], "大腸": [39.9, 39.5], "腎": [45, 35.9], "膀胱": [36.4, 34.8], "艇角": [32.6, 34.5], "肝": [60.3, 41.7], "脾": [67.1, 48.1], "耳中": [48.6, 47.3], "肛門": [36.2, 11.1], "耳先": [57.4, 4.3]},B={"耳迷根":[84.2,47.7]},N=[...Object.keys(F),"耳輪","耳迷根"];let D=[],i=0,o=0,m=0,on=false,lock=false,t0=0,T;
function sh(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function tick(){let s=Math.floor((Date.now()-t0)/1000);time.textContent=String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function show(){lock=false;mark.className="";let n=D[i];q.textContent=n;side.textContent=`読み札 ${i+1} / ${D.length}`;img.src=n==="耳迷根"?"ear_back.PNG":"ear_base.PNG";msg.textContent="正しい場所をタップ👆";next.className="hide"}
function good(n,x,y){if(n==="耳輪")return (x>82&&y>12&&y<75)||(y<12&&x>38&&x<78);let p=n==="耳迷根"?B[n]:F[n],dx=x-p[0],dy=y-p[1];return Math.hypot(dx,dy)<=5.5}
ear.onpointerup=e=>{if(!on||lock)return;let r=ear.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100,n=D[i];mark.className="m";mark.style.left=x+"%";mark.style.top=y+"%";if(good(n,x,y)){mark.style.background="#15966f";ok.textContent=++o;lock=true;msg.textContent="⭕ 正解！";next.className=""}else{mark.style.background="#e64b52";miss.textContent=++m;msg.textContent="❌ ミス。もう一回！"}};
function begin(){D=sh([...N]);i=o=m=0;ok.textContent=miss.textContent=0;on=true;t0=Date.now();clearInterval(T);T=setInterval(tick,500);start.className="hide";show()}start.onclick=begin;next.onclick=()=>{if(++i>=D.length){clearInterval(T);tick();q.textContent="全員出席🤣";msg.textContent=`🎉 ${D.length}札クリア！ 正解 ${o} / ミス ${m}`;on=false;next.className="hide";start.className="";start.textContent="🔥 もう一周"}else show()};
</script></body></html>
