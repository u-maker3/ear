<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>うめこの耳つぼカルタ道場</title><style>
:root{--bg:#fff8f1;--ink:#3d302b;--accent:#e85d75;--ok:#239b72;--ng:#d94343}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(#fff8f1,#ffece9);color:var(--ink);min-height:100vh}.app{max-width:560px;margin:auto;padding:14px 14px 34px}h1{text-align:center;font-size:24px;margin:5px 0 2px}.sub{text-align:center;font-size:13px;opacity:.65;margin:0 0 10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#fff;border-radius:15px;padding:7px;text-align:center;box-shadow:0 4px 15px #6b403012;font-size:12px}.stat b{display:block;font-size:20px}.question{background:#fff;border-radius:18px;padding:12px 14px;margin:10px 0;text-align:center;box-shadow:0 5px 18px #6b403014}.question small{display:block;opacity:.55}.question strong{display:block;font-size:27px;margin-top:2px}.earbox{position:relative;background:#fff;border-radius:24px;padding:8px;box-shadow:0 7px 24px #6b403018;overflow:hidden}.earbox img{display:block;width:100%;height:auto}.hotspot{position:absolute;width:12%;aspect-ratio:1;border:0;border-radius:50%;transform:translate(-50%,-50%);background:rgba(232,93,117,.10);outline:2px dashed rgba(232,93,117,.25);-webkit-tap-highlight-color:transparent}.hotspot:active{background:rgba(232,93,117,.28)}.hotspot.ok{background:rgba(35,155,114,.55);outline:3px solid var(--ok)}.hotspot.ng{background:rgba(217,67,67,.55);outline:3px solid var(--ng)}.msg{text-align:center;min-height:32px;font-weight:800;font-size:19px;padding:7px}.controls{display:flex;gap:8px}.controls button{flex:1;border:0;border-radius:15px;padding:12px;background:#fff;font-weight:800;color:var(--ink);box-shadow:0 4px 14px #50382c16}.note{font-size:11px;line-height:1.55;opacity:.6;margin:10px 3px 0}dialog{border:0;border-radius:22px;padding:22px;width:min(88vw,420px);text-align:center;box-shadow:0 15px 60px #0004}dialog::backdrop{background:#0006}dialog button{border:0;border-radius:14px;padding:12px 22px;background:var(--accent);color:#fff;font-weight:800}</style></head><body><main class="app"><h1>👂 うめこの耳つぼカルタ道場</h1><p class="sub">試作壱号機｜読み札を見て、耳を取れ！</p><section class="stats"><div class="stat">TIME<b id="time">00:00</b></div><div class="stat">GET<b id="score">0/6</b></div><div class="stat">ミス<b id="miss">0</b></div></section><section class="question"><small>読み札</small><strong id="question">スタート！</strong></section><section class="earbox" id="earbox"><img src="ear_base.PNG" alt="耳"><div id="spots"></div></section><div class="msg" id="msg">耳のポイントをタップ👆</div><div class="controls"><button id="restart">🔀 最初から</button></div><p class="note">※現在のポイント座標はゲーム動作確認用の仮配置です。協会テキストの正解位置として確定していません。座標は後から数字だけで調整できます。</p></main><dialog id="clear"><h2>🎊 6枚GET！</h2><p id="result"></p><p id="rank"></p><button id="again">もう一戦🤣</button></dialog><script>
// ★ x=画像の左から%、y=画像の上から%。今は動作確認用の仮座標。
const points=[
{id:'kata',name:'肩',x:24,y:45},{id:'hiza',name:'膝',x:49,y:27},{id:'i',name:'胃',x:39,y:56},
{id:'hai',name:'肺',x:47,y:63},{id:'me',name:'目',x:46,y:83},{id:'jin',name:'腎',x:58,y:49}
];
let order=[],idx=0,miss=0,start=null,timer=null,locked=false;
const q=document.querySelector('#question'),msg=document.querySelector('#msg'),score=document.querySelector('#score'),missEl=document.querySelector('#miss'),timeEl=document.querySelector('#time'),spots=document.querySelector('#spots');
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function clock(){if(start)return;start=Date.now();timer=setInterval(()=>{let s=Math.floor((Date.now()-start)/1000);timeEl.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},500)}
function draw(){spots.innerHTML='';points.forEach(p=>{let b=document.createElement('button');b.className='hotspot';b.style.left=p.x+'%';b.style.top=p.y+'%';b.setAttribute('aria-label','ポイント');b.onclick=()=>tap(p,b);spots.appendChild(b)})}
function ask(){if(idx>=order.length)return finish();q.textContent=order[idx].name;score.textContent=idx+'/'+points.length;msg.textContent='「'+order[idx].name+'」はどこ？👆';locked=false}
function tap(p,b){if(locked)return;clock();let target=order[idx];if(p.id===target.id){locked=true;b.classList.add('ok');msg.textContent='それやーー！👏  '+target.name;idx++;score.textContent=idx+'/'+points.length;setTimeout(()=>{draw();ask()},650)}else{miss++;missEl.textContent=miss;b.classList.add('ng');msg.textContent='そこちゃう🤣';setTimeout(()=>b.classList.remove('ng'),420)}}
function finish(){clearInterval(timer);q.textContent='全問終了！';msg.textContent='耳、よう取った🤣';let rank=miss<=1?'耳の住人👂':miss<=4?'だいぶ分かってきた😎':'耳さわり見習い🤣';document.querySelector('#result').innerHTML=`タイム <b>${timeEl.textContent}</b><br>6問中 <b>6問GET</b> ／ ミス <b>${miss}</b>`;document.querySelector('#rank').innerHTML=`称号：<b>${rank}</b>`;setTimeout(()=>document.querySelector('#clear').showModal(),350)}
function reset(){clearInterval(timer);order=shuffle([...points]);idx=0;miss=0;start=null;locked=false;timeEl.textContent='00:00';missEl.textContent='0';if(document.querySelector('#clear').open)document.querySelector('#clear').close();draw();ask()}
document.querySelector('#restart').onclick=reset;document.querySelector('#again').onclick=reset;reset();
</script></body></html>
