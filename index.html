<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>うめこの耳つぼ道場｜神経衰弱</title><style>
:root{--bg:#fff8f1;--ink:#3d302b;--accent:#e85d75;--gold:#d99b35;--card:#fff;--back:#7b4b67}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(#fff8f1,#ffece9);color:var(--ink);min-height:100vh}.app{max-width:680px;margin:auto;padding:18px 14px 40px}h1{font-size:25px;margin:6px 0 2px;text-align:center}.sub{text-align:center;margin:0 0 14px;font-size:13px;opacity:.7}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{background:#fff;border-radius:14px;padding:8px;text-align:center;box-shadow:0 4px 15px #6b403014}.stat b{display:block;font-size:19px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.card{border:0;padding:0;background:transparent;aspect-ratio:3/4;perspective:800px;cursor:pointer}.inner{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}.card.open .inner,.card.matched .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;overflow:hidden;box-shadow:0 5px 14px #50382c22;border:2px solid #fff}.back{display:flex;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(145deg,#94617e,#60364f);color:white}.back .ear{font-size:34px}.back small{font-weight:700}.front{transform:rotateY(180deg);background:#fff;display:flex;align-items:center;justify-content:center;padding:7px}.name{font-size:19px;font-weight:800}.earwrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}.earwrap img{width:100%;height:100%;object-fit:contain}.dot{position:absolute;width:16px;height:16px;border-radius:50%;background:#e53243;border:3px solid white;box-shadow:0 0 0 2px #e53243;transform:translate(-50%,-50%)}.matched .face{box-shadow:0 0 0 3px #e4b04f,0 5px 14px #50382c22}.controls{display:flex;gap:8px;margin-top:14px}.controls button{flex:1;border:0;border-radius:14px;padding:12px;font-weight:800;background:#fff;color:var(--ink);box-shadow:0 4px 12px #50382c18}.note{font-size:12px;line-height:1.6;margin:14px 4px 0;opacity:.65}.toast{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%) scale(.9);background:#33251fe9;color:#fff;padding:12px 18px;border-radius:999px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:10;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}dialog{border:0;border-radius:22px;padding:22px;width:min(88vw,420px);text-align:center;box-shadow:0 15px 60px #0004}dialog::backdrop{background:#0006}dialog h2{margin-top:0}dialog button{border:0;border-radius:14px;padding:12px 22px;background:var(--accent);color:white;font-weight:800}@media(min-width:520px){.board{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main class="app"><h1>👂 うめこの耳つぼ道場</h1><p class="sub">神経衰弱・試作壱号機</p><section class="stats"><div class="stat">TIME<b id="time">00:00</b></div><div class="stat">めくった<b id="turns">0</b></div><div class="stat">ミス<b id="misses">0</b></div></section><section id="board" class="board"></section><div class="controls"><button id="restart">🔀 もう一回</button></div><p class="note">※試作版。赤●の座標は調整用の仮配置です。協会テキストの正解位置としては確定していません。<br>画像ファイル名は <b>ear_base.PNG</b> のまま、index.html と同じ場所に置いてください。</p></main><div id="toast" class="toast"></div><dialog id="clear"><h2>🎊 全問そろった！</h2><p id="result"></p><p id="title"></p><button id="again">もう一戦🤣</button></dialog><script>
// ★ここだけ直せばポイント位置を調整できます。x=左から%、y=上から%。
// 現在の座標はゲーム動作確認用の仮配置です。
const points=[
 {id:'kata',name:'肩',x:57,y:42},
 {id:'hiza',name:'膝',x:53,y:31},
 {id:'i',name:'胃',x:50,y:58},
 {id:'hai',name:'肺',x:48,y:65},
 {id:'me',name:'目',x:52,y:82},
 {id:'jin',name:'腎',x:59,y:54}
];
let first=null,lock=false,matched=0,turns=0,misses=0,start=null,timer=null;
const board=document.querySelector('#board'),timeEl=document.querySelector('#time'),turnEl=document.querySelector('#turns'),missEl=document.querySelector('#misses'),toast=document.querySelector('#toast');
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function deck(){return shuffle(points.flatMap(p=>[{...p,type:'name',key:p.id+'n'},{...p,type:'spot',key:p.id+'s'}]))}
function startClock(){if(start)return;start=Date.now();timer=setInterval(()=>{const s=Math.floor((Date.now()-start)/1000);timeEl.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},500)}
function say(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),650)}
function makeCard(c){const b=document.createElement('button');b.className='card';b.dataset.id=c.id;b.dataset.key=c.key;b.innerHTML=`<span class="inner"><span class="face back"><span class="ear">👂</span><small>耳つぼ道場</small></span><span class="face front">${c.type==='name'?`<span class="name">${c.name}</span>`:`<span class="earwrap"><img src="ear_base.PNG" alt="耳"><i class="dot" style="left:${c.x}%;top:${c.y}%"></i></span>`}</span></span>`;b.onclick=()=>flip(b);return b}
function flip(c){if(lock||c.classList.contains('open')||c.classList.contains('matched'))return;startClock();c.classList.add('open');turns++;turnEl.textContent=turns;if(!first){first=c;return}if(first.dataset.id===c.dataset.id && first.dataset.key!==c.dataset.key){first.classList.add('matched');c.classList.add('matched');first=null;matched++;say('それやーー！👏');if(matched===points.length)finish()}else{lock=true;misses++;missEl.textContent=misses;say('そこちゃう🤣');const a=first;first=null;setTimeout(()=>{a.classList.remove('open');c.classList.remove('open');lock=false},800)}}
function finish(){clearInterval(timer);const sec=start?Math.floor((Date.now()-start)/1000):0;let rank=misses<=2?'耳の住人👂':misses<=5?'だいぶ分かってきた😎':'耳さわり見習い🤣';document.querySelector('#result').innerHTML=`タイム <b>${timeEl.textContent}</b><br>めくった回数 <b>${turns}</b> ／ ミス <b>${misses}</b>`;document.querySelector('#title').innerHTML=`称号：<b>${rank}</b>`;setTimeout(()=>document.querySelector('#clear').showModal(),450)}
function reset(){clearInterval(timer);first=null;lock=false;matched=turns=misses=0;start=null;timeEl.textContent='00:00';turnEl.textContent=missEl.textContent='0';board.innerHTML='';deck().forEach(c=>board.appendChild(makeCard(c)));if(document.querySelector('#clear').open)document.querySelector('#clear').close()}
document.querySelector('#restart').onclick=reset;document.querySelector('#again').onclick=reset;reset();
</script></body></html>
