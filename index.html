<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>耳つぼ どこやねん！</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7cfd3;color:#382d2b;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;text-align:center}.w{max-width:520px;margin:auto;padding:14px}.stats{display:flex;gap:7px;margin-bottom:9px}.stats div,.c{background:#fffdfd;border-radius:18px;padding:10px;flex:1}#q{font-size:30px;font-weight:900;margin:3px}.ear{position:relative;width:min(90vw,410px);margin:8px auto;touch-action:manipulation}img{width:100%;display:block;border-radius:14px}.mark,.answer{position:absolute;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}.mark{width:26px;height:26px;border:4px solid #fff;box-shadow:0 1px 7px #0007}.answer{width:52px;height:52px;border:5px solid #15966f;background:#15966f55;animation:pulse .55s ease 2}@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.45)}}#pop{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) scale(.7);opacity:0;pointer-events:none;background:#fffdf8eF;border-radius:22px;padding:10px 16px;font-size:25px;font-weight:900;white-space:nowrap;box-shadow:0 5px 18px #0002;z-index:5}#pop.show{animation:popin .7s ease forwards}@keyframes popin{0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}45%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}#msg{min-height:48px;font-size:18px;font-weight:900}button{border:0;border-radius:14px;padding:13px 17px;margin:5px;font-weight:900;font-size:16px;background:#55b4cf;color:#fff;box-shadow:0 3px 0 rgba(34,139,170,.18)}.choice button{min-width:110px}.nearBtns{margin-top:2px}.skipBtn{background:#f2e3e5;color:#513d48}.hide{display:none}.sub{font-size:13px;color:#826f69}
#mascotWrap{height:58px;display:flex;align-items:center;justify-content:center;margin:0 0 4px}
#mascot{display:block;width:auto;height:auto;max-height:56px;max-width:82px;object-fit:contain}
#menuMascot{display:block;width:auto;height:auto;max-height:78px;max-width:105px;object-fit:contain;margin:0 auto}
#menu #mascotWrap{height:82px;margin:0 0 2px}
.mcsActionMascot{position:fixed;right:10px;bottom:88px;z-index:9999;width:118px;height:118px;display:flex;align-items:flex-end;justify-content:flex-end;margin:0;pointer-events:none}
.mcsActionMascot img{display:block;width:auto;height:auto;max-height:118px;max-width:118px;object-fit:contain;filter:drop-shadow(0 4px 7px rgba(0,0,0,.16))}
@media (max-width:390px){.mcsActionMascot{right:6px;bottom:82px;width:105px;height:105px}.mcsActionMascot img{max-width:105px;max-height:105px}}
.reviewBox{margin:16px 0 4px;padding:16px;border-radius:18px;background:#fff7f8;text-align:center}.reviewBox b{font-size:20px}.reviewList{font-size:14px;line-height:1.7;margin:8px 0 12px}.reviewBtn{border:0;border-radius:16px;padding:13px 18px;font-weight:800;font-size:16px;background:#55b4cf;color:white}.reviewBtn:disabled{opacity:.45}.endActions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}.homeBtn,.finishBtn{border:0;border-radius:15px;padding:12px 15px;font-weight:800;font-size:15px}.homeBtn{background:#eee7e3;color:#4a3b38}.finishBtn{background:#5f536b;color:#fff}.finishMsg{margin-top:14px;font-weight:800;line-height:1.7}
.mcsLogo{width:118px;height:118px;object-fit:contain;margin:2px auto 6px;display:block;border-radius:50%}.brandTitle{margin:2px 0 0}.brandSub{color:#5b8fa0;font-weight:700}
#game{margin-top:8px;position:relative;padding-top:12px}
#game .stats{margin:0 0 3px;gap:4px}#game .stats div{padding:3px 2px;font-size:10px;line-height:1.05}#game .c{padding:4px 6px 6px}#game #side{font-size:13px;line-height:1;padding-left:86px!important;padding-right:8px!important;text-align:center}#game #q{font-size:clamp(28px,8vw,36px);line-height:1.02!important;margin:0!important;padding:0 18px 0 86px!important;text-align:center!important;width:100%!important;display:block!important;box-sizing:border-box!important;min-height:auto!important}#game .ear{width:min(82vw,350px,56vh);margin:4px auto}#game #msg{min-height:30px;font-size:17px;line-height:1.15}#game button{padding:10px 15px;font-size:16px;margin:3px}#game #pop{font-size:19px;padding:7px 11px;border-radius:16px}
#game .mcsActionMascot{width:82px;height:82px;right:5px;bottom:62px}#game .mcsActionMascot img{max-width:82px;max-height:82px}
@media(max-height:800px){#game .stats{display:none}#game .ear{width:min(79vw,335px,53vh)}}@media(max-height:700px){#game .ear{width:min(74vw,310px,48vh)}}
#game .gameMcsLogo{position:absolute!important;left:10px!important;top:10px!important;width:70px!important;height:70px!important;margin:0!important;z-index:20;object-fit:contain;border-radius:50%;filter:drop-shadow(0 2px 4px rgba(0,0,0,.12))}
#game #q.endTitle{font-size:clamp(19px,5.3vw,25px)!important;line-height:1.1!important;padding-left:94px!important;padding-right:8px!important}
#qReading{display:block;width:100%!important;box-sizing:border-box!important;padding-left:86px!important;padding-right:18px!important;text-align:center!important;margin:3px 0 8px!important;min-height:18px!important;line-height:1!important;font-size:clamp(13px,3.7vw,17px)!important;font-weight:700!important;color:#58b5cf;letter-spacing:.04em}#q.endTitle + #qReading{display:none}
@media(max-width:380px){#game .gameMcsLogo{width:62px!important;height:62px!important;left:8px!important;top:8px!important}#game #side{padding-left:76px!important}#game #q,#qReading{padding-left:76px!important}}
</style></head><body><div class=w><div id=menu class=c><div id="brandHeader"><img class="mcsLogo" src="mcs_logo.JPG" alt="Mimitubo Care School MCS"><h2 class="brandTitle">👂 耳つぼ どこやねん！</h2><div class="sub brandSub">耳の地図を遊んで覚えるゲーム</div></div><div id="mascotWrap"><img id="menuMascot" src="mcs_start.PNG" alt=""></div><b>何問いく？🤣</b><div class=choice><button data-n=10>サクッと<br>10問</button><button data-n=20>しっかり<br>20問</button><button data-n=50>地獄の<br>全50問</button></div><div class=sub>毎回ランダム出題やで👌</div><div class=sub style="margin-top:10px">※耳の形や位置には個人差があります。このゲームは位置関係をざっくり楽しく覚えるための学習用です。細かい位置・判断が難しい場所は、必ず協会テキストで確認してください。</div></div>
<div id=game class=hide><img class="gameMcsLogo" src="mcs_logo.JPG" alt="MCS"><div class=stats><div>TIME<br><b id=time>00:00</b></div><div>正解<br><b id=ok>0</b></div><div>ミス<br><b id=miss>0</b></div><div>スルー<br><b id=skips>0</b></div></div><div class=c><small id=side></small><div id=q></div><div id="qReading" aria-label="ふりがな"></div><div class=ear id=ear><img id=img src=ear_base.PNG><span id=mark></span><div id=pop></div></div><div id=msg></div><div class="nearBtns"><button id=next class=hide>➡️ 次の札</button><div id="reviewBox" class="reviewBox hide"><b>📚 苦手だけ再復習</b><div id="reviewList" class="reviewList"></div><button id="reviewBtn" class="reviewBtn">🔁 間違えたとこだけ再挑戦</button><div class="endActions"><button id="homeBtn" class="homeBtn">🏠 最初に戻る</button><button id="finishBtn" class="finishBtn">🌙 今日は終わる</button></div><div id="finishMsg" class="finishMsg hide"></div></div><div class="mcsActionMascot"><img id="mascot" src="mcs_point.PNG" alt=""></div><button id=skip class="skipBtn">🙈 わからん！スルー</button></div></div></div></div>
<script>
window.MCS_READINGS={"神門":"しんもん","角窩中":"かくかちゅう","内生殖器":"ないせいしょくき","交感":"こうかん","坐骨神経":"ざこつしんけい","股関節":"こかんせつ","膝":"ひざ","踝":"くるぶし","風渓":"ふうけい","腰仙椎":"ようせんつい","胸椎":"きょうつい","頸椎":"けいつい","腕":"うで","肘":"ひじ","肩":"かた","鎖骨":"さこつ","後頭":"こうとう","側頭":"そくとう","前頭":"ぜんとう","大脳皮質下":"だいのうひしつか","顎":"あご","歯":"は","内耳":"ないじ","目":"め","扁桃体":"へんとうたい","内分泌":"ないぶんぴつ","三焦":"さんしょう","肺":"はい","心":"しん","気管":"きかん","副腎":"ふくじん","飢点":"きてん","内鼻":"ないび","咽喉":"いんこう","口":"くち","食道":"しょくどう","噴門":"ふんもん","胃":"い","小腸":"しょうちょう","大腸":"だいちょう","腎":"じん","膀胱":"ぼうこう","艇角":"ていかく","肝":"かん","脾":"ひ","耳中":"じちゅう","肛門":"こうもん","耳先":"じせん","耳輪":"じりん","耳迷根":"じめいこん"};

const F={"神門":[45.7,27.8],"角窩中":[39.7,26.9],"内生殖器":[33,25.3],"交感":[31.7,30.5],"坐骨神経":[40.2,32.5],"股関節":[73.2,21.5],"膝":[70.6,17.4],"踝":[64.5,13.7],"風渓":[78.5,24.2],"腰仙椎":[78.3,27.6],"胸椎":[82.2,52.7],"頸椎":[73.3,62.8],"腕":[77.8,25],"肘":[83.9,32.9],"肩":[85.1,47.1],"鎖骨":[76,59.5],"後頭":[66.4,64.2],"側頭":[49.9,64.4],"前頭":[37.7,72.3],"大脳皮質下":[48.5,64.6],"顎":[51.8,76.8],"歯":[25.6,79.9],"内耳":[50.7,88.8],"目":[36.6,87.4],"扁桃体":[33.7,94.1],"内分泌":[29,66.6],"三焦":[30.3,64.6],"肺":[44.5,56.6],"心":[39.6,56.6],"気管":[35.9,55.1],"副腎":[27.3,55.7],"飢点":[18.9,55.1],"内鼻":[32.2,53.1],"咽喉":[31.9,46.6],"口":[34.7,49.1],"食道":[40.6,50.4],"噴門":[53,51.9],"胃":[65.8,52.2],"小腸":[50.7,44],"大腸":[36.3,38.6],"腎":[53.2,35.6],"膀胱":[42.1,34.4],"艇角":[31.2,32.9],"肝":[64.4,41.3],"脾":[65.8,56.3],"耳中":[49.7,47.4],"肛門":[39.2,10.3],"耳先":[58.2,5.9],"耳輪":[85.7,23.3]},
B={"耳迷根":[83.5,45.7]},
ALL=[...Object.keys(F),"耳迷根"];
let D=[],i=0,o=0,m=0,s=0,lock=false,t0=0,T,wrongSet=new Set(),reviewMode=false;
function sh(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function tick(){let s=Math.floor((Date.now()-t0)/1000);time.textContent=String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function show(){reviewBox.className="reviewBox hide";setMascot(D[i]==="耳迷根"?"mcs_ear_back.PNG":"mcs_point.PNG");lock=false;mark.className="";pop.className="";pop.innerHTML="";let n=D[i];q.textContent=n;side.textContent=`読み札 ${i+1} / ${D.length}`;img.src=(n==="内鼻"||n==="咽喉")?"ear_hidden.PNG":(n==="耳迷根"?"ear_back.PNG":"ear_base.PNG");msg.textContent="どこや！と思う辺りをポチッ👆";next.className="hide"}
function good(n,x,y){let p=n==="耳迷根"?B[n]:F[n];return Math.hypot(x-p[0],y-p[1])<=9}
ear.onpointerup=e=>{if(lock)return;let r=ear.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100,n=D[i];mark.className="mark";mark.style.left=x+"%";mark.style.top=y+"%";if(good(n,x,y)){mark.style.background="#15966f";ok.textContent=++o;lock=true;setMascot("mcs_correct.PNG");pop.innerHTML="💮 せいかーい！<br><span style=\"font-size:14px\">その辺、その辺🤣</span>";pop.className="show";msg.textContent="";next.className=""}else{wrongSet.add(n);mark.style.background="#e64b52";miss.textContent=++m;setMascot("mcs_think.PNG");pop.innerHTML="そこちゃう🤣";pop.className="show";setTimeout(()=>{pop.className="";},650);msg.textContent="もう一回👆"}};
function advance(){if(++i>=D.length){clearInterval(T);tick();setMascot("mcs_ok.PNG");q.textContent=reviewMode?"再復習おわり💮":"本日の耳探検、終了💮";msg.textContent=`正解 ${o}問 ／ ミス ${m}回 ／ スルー ${s}問 ／ TIME ${time.textContent}`;next.className="hide";skip.className="hide";const bad=[...wrongSet];reviewBox.className="reviewBox";if(bad.length){reviewList.innerHTML=`今回の復習箱：<b>${bad.length}個</b><br>${bad.join("・")}`;reviewBtn.disabled=false;reviewBtn.textContent="🔁 苦手だけ再挑戦"}else{reviewList.innerHTML="🎉 復習箱は空っぽ！<br>全部いけたで💮";reviewBtn.disabled=true;reviewBtn.textContent="💮 復習なし"}}else show()}
document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{let n=+b.dataset.n;D=sh([...ALL]).slice(0,n);i=o=m=s=0;wrongSet=new Set();reviewMode=false;ok.textContent=miss.textContent=skips.textContent=0;menu.className="hide";game.className="";t0=Date.now();clearInterval(T);T=setInterval(tick,500);show();setTimeout(()=>game.scrollIntoView({behavior:"smooth",block:"start"}),60)});
next.onclick=advance;skip.onclick=()=>{if(lock)return;wrongSet.add(D[i]);s++;skips.textContent=s;setMascot("mcs_skip.PNG");pop.innerHTML="🙈 スルー！<br><span style=\"font-size:14px\">テキスト見よ🤣</span>";pop.className="show";lock=true;setTimeout(advance,650)};
reviewBtn.onclick=()=>{const bad=[...wrongSet];if(!bad.length)return;D=sh(bad);i=o=m=s=0;wrongSet=new Set();reviewMode=true;ok.textContent=miss.textContent=skips.textContent=0;reviewBox.className="reviewBox hide";skip.className="skipBtn";t0=Date.now();clearInterval(T);T=setInterval(tick,500);show();setTimeout(()=>game.scrollIntoView({behavior:"smooth",block:"start"}),60)};
homeBtn.onclick=()=>{clearInterval(T);reviewBox.className="reviewBox hide";game.className="hide";menu.className="c";skip.className="skipBtn";wrongSet=new Set();reviewMode=false};
finishBtn.onclick=()=>{clearInterval(T);reviewBtn.className="hide";homeBtn.className="hide";finishBtn.className="hide";finishMsg.className="finishMsg";finishMsg.innerHTML="今日の耳探検はここまで👂💮<br>おつかれさん！またやろな🤣";setMascot("mcs_ok.PNG")};
function setMascot(file){var el=document.getElementById("mascot");if(el)el.src=file}
</script>
<script>(function(){const q=document.getElementById("q");if(!q)return;const f=()=>q.classList.toggle("endTitle",q.textContent.includes("本日の耳探検、終了"));new MutationObserver(f).observe(q,{childList:true,subtree:true,characterData:true});f()})();</script>
<script>(function(){const q=document.getElementById("q"),r=document.getElementById("qReading");if(!q||!r)return;function f(){const n=(q.textContent||"").trim();if(n.includes("本日の耳探検、終了")){r.textContent="";r.style.display="none";return}r.style.display="";const y=(window.MCS_READINGS||{})[n];r.textContent=y?"（"+y+"）":""}new MutationObserver(f).observe(q,{childList:true,subtree:true,characterData:true});f()})();</script></body></html>
